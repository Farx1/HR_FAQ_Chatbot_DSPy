name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    env:
      DEMO_MODE: 1
      PYTHONPATH: ${{ github.workspace }}
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backend/requirements.txt
    
    - name: Lint with ruff
      run: |
        ruff check backend/ dspy_module/ tests/ --output-format=github
    
    - name: Format check with ruff
      run: |
        ruff format --check backend/ dspy_module/ tests/
    
    - name: Run tests
      run: |
        pytest -q --tb=short
    
    - name: Test backend imports
      run: |
        python -c "import backend.server; print('Backend imports OK')"
        python -c "from backend.rag_engine import get_rag_engine; print('RAG engine imports OK')"

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: webapp/package-lock.json
    
    - name: Cache Next.js build
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.npm
          ${{ github.workspace }}/webapp/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('webapp/package-lock.json') }}-${{ hashFiles('webapp/**/*.js', 'webapp/**/*.jsx', 'webapp/**/*.ts', 'webapp/**/*.tsx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('webapp/package-lock.json') }}-
    
    - name: Install dependencies
      working-directory: webapp
      run: npm ci
    
    - name: Lint
      working-directory: webapp
      run: npm run lint
    
    - name: Build
      working-directory: webapp
      run: npm run build
    
    - name: Check build output
      run: |
        test -d webapp/.next && echo "Build successful" || exit 1

  benchmark-smoke:
    name: Benchmark Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    env:
      DEMO_MODE: 1
      PYTHONPATH: ${{ github.workspace }}
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run benchmark smoke test
      run: |
        python benchmark_professional.py --smoke

